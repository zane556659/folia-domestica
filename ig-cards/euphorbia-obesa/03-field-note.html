<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Content Text — Botanical</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

.card {
  width: 1080px;
  height: 1350px;
  background-color: #f1e9d6;
  background-image:
    radial-gradient(ellipse at 15% 10%, rgba(120,90,50,0.08) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(80,60,30,0.06) 0%, transparent 50%);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 0 80px;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle at 6%  20%, rgba(140,90,30,0.11) 0%, transparent 0.8%),
    radial-gradient(circle at 94% 15%, rgba(120,70,20,0.10) 0%, transparent 0.6%),
    radial-gradient(circle at 80% 88%, rgba(140,90,30,0.10) 0%, transparent 0.5%);
  mix-blend-mode: multiply;
  z-index: 0;
}

/* ── Top ─────────────────────── */
.top-row {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 28px 0 22px;
  position: relative;
  z-index: 1;
}

.series-label {
  font-family: 'IM Fell English SC', serif;
  font-size: 22px;
  letter-spacing: 0.22em;
  color: #7a6a4f;
  white-space: nowrap;
}

.top-rule {
  flex: 1;
  border-top: 1px solid #8a7a5c;
}

/* ── Section title ───────────── */
.section-title {
  flex-shrink: 0;
  font-family: 'IM Fell English', serif;
  font-size: 68px;
  font-weight: 400;
  color: #2f3a22;
  line-height: 1.08;
  margin: 12px 0 0;
  position: relative;
  z-index: 1;
}

.title-rule {
  flex-shrink: 0;
  border: none;
  border-top: 1px solid #8a7a5c;
  margin: 20px 0 28px;
  position: relative;
  z-index: 1;
}

/* ── Bullet list ─────────────── */
.bullet-list {
  flex: 1;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
  z-index: 1;
  overflow: hidden;
}

.bullet-item {
  display: flex;
  gap: 32px;
  align-items: flex-start;
  padding: 18px 0;
  border-bottom: 1px solid rgba(138,122,92,0.3);
}

.bullet-item:last-child {
  border-bottom: none;
}

.bullet-num {
  flex-shrink: 0;
  font-family: 'IM Fell English', serif;
  font-style: italic;
  font-size: 44px;
  color: #8a7a5c;
  line-height: 1.5;
  width: 36px;
  text-align: right;
}

.bullet-content {
  flex: 1;
}

.bullet-keyword {
  font-family: 'EB Garamond', serif;
  font-size: 46px;
  font-weight: 600;
  color: #2a2419;
  line-height: 1.3;
  display: block;
  margin-bottom: 4px;
}

.bullet-desc {
  font-family: 'EB Garamond', serif;
  font-size: 38px;
  color: #4a3f2c;
  line-height: 1.6;
}

/* ── Quote ───────────────────── */
.bquote {
  flex-shrink: 0;
  border-left: 4px double #8a7a5c;
  padding: 16px 24px;
  background: #f7f0dd;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 38px;
  line-height: 1.65;
  color: #4a3f2c;
  margin: 20px 0 0;
  position: relative;
  z-index: 1;
}

/* ── Bottom bar ──────────────── */
.bottom-bar {
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0 28px;
  border-top: 1px solid #8a7a5c;
  position: relative;
  z-index: 1;
}

.handle {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 28px;
  color: #7a6a4f;
}

.page-num {
  font-family: 'IM Fell English SC', serif;
  font-size: 22px;
  letter-spacing: 0.12em;
  color: #8a7a5c;
}
</style>
</head>
<body>
<div class="card">

  <!-- Top label -->
  <div class="top-row">
    <span class="series-label">家中花草志</span>
    <div class="top-rule"></div>
  </div>

  <!-- Section title -->
  <h2 class="section-title">在卡魯被叫作<br>「胖小人」</h2>
  <hr class="title-rule">

  <!-- Bullets -->
  <ul class="bullet-list">
    <li class="bullet-item">
      <span class="bullet-num">一</span>
      <div class="bullet-content">
        <span class="bullet-keyword">Vetmensie</span>
        <span class="bullet-desc">這是它在南非 Afrikaans 裡留下的地方名字。</span>
      </div>
    </li>
    <li class="bullet-item">
      <span class="bullet-num">二</span>
      <div class="bullet-content">
        <span class="bullet-keyword">石頭之間</span>
        <span class="bullet-desc">它躲在石坡、鬆砂與矮灌木下，本來就不容易被看見。</span>
      </div>
    </li>
    <li class="bullet-item">
      <span class="bullet-num">三</span>
      <div class="bullet-content">
        <span class="bullet-keyword">被帶離的植物</span>
        <span class="bullet-desc">描述後不久，收藏採集已讓野外族群承受壓力。</span>
      </div>
    </li>
    <li class="bullet-item">
      <span class="bullet-num">四</span>
      <div class="bullet-content">
        <span class="bullet-keyword">今天仍在減少</span>
        <span class="bullet-desc">南非官方評估：野外成熟植株估計少於 500 株。</span>
      </div>
    </li>
  </ul>

  <!-- Optional quote -->
  <div class="bquote">它先是地方的名字，後來才成為全世界收藏架上的一顆球。</div>

  <!-- Bottom -->
  <div class="bottom-bar">
    <span class="handle">@ziv.plant</span>
    <span class="page-num">3 / 4</span>
  </div>

</div>
</body>
</html>
